<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- Gradiente pixelado de fundo: Céu ao pôr do sol na Galileia -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1C2E"/>
      <stop offset="40%" stop-color="#392B58"/>
      <stop offset="70%" stop-color="#7B3E59"/>
      <stop offset="100%" stop-color="#D97642"/>
    </linearGradient>
  </defs>

  <!-- Borda de App moderna arredondada -->
  <clipPath id="squircle">
    <rect x="0" y="0" width="512" height="512" rx="115" />
  </clipPath>

  <g clip-path="url(#squircle)">
    <!-- Céu -->
    <rect x="0" y="0" width="512" height="340" fill="url(#skyGrad)"/>

    <!-- Sol / Halo dourado divino -->
    <rect x="192" y="112" width="128" height="128" fill="#FCEE71" opacity="0.25"/>
    <rect x="208" y="128" width="96" height="96" fill="#FCEE71" opacity="0.6"/>
    <rect x="224" y="144" width="64" height="64" fill="#FFF7A8"/>

    <!-- Cruz sutil estilizada em Pixel Art no horizonte -->
    <rect x="248" y="80" width="16" height="128" fill="#FFF" opacity="0.85"/>
    <rect x="216" y="112" width="80" height="16" fill="#FFF" opacity="0.85"/>

    <!-- Mar da Galileia (Ondas horizontais pixeladas) -->
    <rect x="0" y="320" width="512" height="192" fill="#1C3852"/>
    <!-- Linhas de reflexo e água -->
    <rect x="0" y="336" width="512" height="16" fill="#285073"/>
    <rect x="176" y="328" width="160" height="8" fill="#F7A156" opacity="0.6"/>
    <rect x="208" y="344" width="96" height="8" fill="#E86A38" opacity="0.5"/>
    <rect x="48" y="368" width="96" height="8" fill="#3B739B"/>
    <rect x="368" y="384" width="80" height="8" fill="#3B739B"/>
    <rect x="144" y="408" width="128" height="8" fill="#285073"/>
    <rect x="0" y="440" width="512" height="72" fill="#112435"/>

    <!-- A Barca de Pedro (Silhueta clássica em madeira 16-bit) -->
    <g id="boat">
      <!-- Mastro -->
      <rect x="248" y="192" width="16" height="96" fill="#422216"/>
      <rect x="208" y="208" width="96" height="8" fill="#422216"/>

      <!-- Casco da barca -->
      <rect x="128" y="272" width="256" height="16" fill="#6B3A23"/>
      <rect x="112" y="288" width="288" height="24" fill="#522C1A"/>
      <rect x="144" y="312" width="224" height="16" fill="#381D10"/>
      <rect x="176" y="328" width="160" height="8" fill="#241208"/>

      <!-- Detalhes de tábuas na madeira -->
      <rect x="144" y="280" width="32" height="8" fill="#874C30"/>
      <rect x="208" y="280" width="96" height="8" fill="#874C30"/>
      <rect x="336" y="280" width="32" height="8" fill="#874C30"/>
    </g>

    <!-- A Rede de Pesca pendurada (Trama romboidal pixel art) -->
    <g id="fishing-net" opacity="0.9">
      <rect x="288" y="296" width="112" height="80" fill="none"/>
      <!-- Nós da rede -->
      <g fill="#D4AF37">
        <circle cx="296" cy="304" r="3"/>
        <circle cx="320" cy="304" r="3"/>
        <circle cx="344" cy="304" r="3"/>
        <circle cx="368" cy="304" r="3"/>
        <circle cx="308" cy="324" r="3"/>
        <circle cx="332" cy="324" r="3"/>
        <circle cx="356" cy="324" r="3"/>
        <circle cx="380" cy="324" r="3"/>
        <circle cx="320" cy="344" r="3"/>
        <circle cx="344" cy="344" r="3"/>
        <circle cx="368" cy="344" r="3"/>
        <circle cx="332" cy="364" r="3"/>
        <circle cx="356" cy="364" r="3"/>
      </g>
      <!-- Cordas entrelaçadas -->
      <path d="M296 304 L380 324 M320 304 L368 344 M308 324 L356 364" stroke="#A68322" stroke-width="2" stroke-dasharray="4,4"/>
    </g>

    <!-- O Peixe Prateado (Símbolo do milagre e do chamado) -->
    <g id="miracle-fish">
      <rect x="336" y="328" width="32" height="12" rx="4" fill="#E0F0FF"/>
      <!-- Cauda e nadadeira -->
      <polygon points="364,334 376,324 376,344" fill="#90B8DE"/>
      <polygon points="348,328 354,320 358,328" fill="#90B8DE"/>
      <!-- Olho pixelado -->
      <rect x="340" y="331" width="3" height="3" fill="#1C3852"/>
      <!-- Brilho milagroso -->
      <rect x="332" y="316" width="6" height="6" fill="#FFF"/>
      <rect x="372" y="348" width="4" height="4" fill="#FFF"/>
    </g>

    <!-- Moldura externa sutil de 16-bits -->
    <rect x="0" y="0" width="512" height="512" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.1" rx="115"/>
  </g>
</svg>
